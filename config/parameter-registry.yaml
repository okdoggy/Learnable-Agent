schema_version: "1.0"
calibration_version: "1.2.0"
edit_plan_version: "1.0"
remaster_engine_version: "1.1.0"
input_color_space: "sRGB"
working_color_space: "linear-sRGB"
parameters:
  brightness:
    range: [-100, 100]
    default: 0
    mapping: "linear RGB exposure gain = 2 ** (value / 50)"
  contrast:
    range: [-100, 100]
    default: 0
    mapping: "linear RGB pivot 0.18, factor = 2 ** (value / 60)"
  highlights:
    range: [-100, 100]
    default: 0
    mapping: "luminance-weighted highlight delta, maximum magnitude 0.32"
  shadows:
    range: [-100, 100]
    default: 0
    mapping: "luminance-weighted shadow delta, maximum magnitude 0.32"
  saturation:
    range: [-100, 100]
    default: 0
    mapping: "linear RGB luminance blend, factor = max(0, 1 + value / 100)"
  temperature:
    range: [-100, 100]
    default: 0
    mapping: "bounded red/blue channel gain, maximum delta 0.12"
  tint:
    range: [-100, 100]
    default: 0
    mapping: "bounded green/magenta channel gain, maximum delta 0.10"
  sharpness:
    range: [0, 100]
    default: 0
    mapping: "Pillow UnsharpMask after tone/color operations"
  denoise:
    range: [0, 100]
    default: 0
    mapping: "bounded Gaussian blur blended by value / 100"
  vignette:
    range: [-100, 100]
    default: 0
    mapping: "radial linear RGB edge gain, maximum magnitude 0.55"

capabilities:
  remaster:
    scope: "global"
    supports:
      - "global-linear-tone-and-color"
      - "global-gaussian-denoise"
      - "global-unsharp-mask"
      - "global-radial-vignette"
      - "bounded-channel-gamma-and-gain"
      - "bounded-selective-hsl"
    unsupported:
      - "semantic-local-masks"
      - "subject-background-independent-adjustment"
      - "skin-protected-edge-only-sharpening"
      - "local-warm-cool-separation"
  lut:
    scope: "global"
    engine: "expert_grade"
    supports: ["approved-global-color-transform", "skin-protected-global-grade", "shadow-grain", "highlight-halation"]
    unsupported: ["semantic-local-masks", "object-local-color-transform", "subject-background-independent-adjustment"]
    parameters:
      lut_intensity: "0.0–1.0 원본과 LUT 결과의 블렌드 강도"
      skin_protection: "인물의 피부 색차 완화; film_noir에는 적용하지 않음"
      grain_amount: "0.0–1.0, 그림자 가중 필름 그레인"
      halation: "0.0–1.0, 밝은 영역 붉은 bloom"
      use_aces: "현재 .cube sRGB 경로에서는 호환용 메타데이터"
  generate_ai:
    scope: "semantic-generative-edit"
    engine:
      provider: "openai-image-api"
      model: "gpt-image-2"
      quality: "low"
      sizes: ["1024x1024", "1536x1024", "1024x1536"]
      output_format: "png"
    supports:
      - "identity-preserve"
      - "precise-object-edit"
      - "lighting-weather"
      - "background-extraction"
      - "style-transfer"
      - "compositing"
      - "sketch-to-render"
    caution: "보존 조건에도 미세한 픽셀 재구성이 발생할 수 있다."
calibration:
  principles:
    - "이미지와 사용자 의도의 전체 문맥으로 판단하며 registry를 키워드 프리셋으로 사용하지 않는다."
    - "보수적 출발 범위에서 시작하고 여러 파라미터의 누적 효과를 고려한다."
    - "범위를 벗어날 수 있지만 이미지 정량 분석과 구체적 이유를 plan에 남긴다."
  remaster_conservative_start_ranges:
    brightness: [-2, 2]
    contrast: [-3, 3]
    highlights: [-5, 5]
    shadows: [-5, 5]
    saturation: [-3, 3]
    temperature: [-3, 3]
    tint: [-2, 2]
    sharpness: [0, 3]
    denoise: [0, 3]
    vignette: [-3, 3]
  known_interactions:
    - "brightness와 양의 shadows는 암부·배경을 함께 누적 상승시켜 검정점과 깊이를 약화할 수 있다."
    - "음의 highlights와 양의 shadows를 함께 높이면 clipping 없이도 전역 대비가 평평해질 수 있다."
    - "denoise와 sharpness는 모두 전역이며 피부 보호 또는 에지 마스크를 구현하지 않는다."
    - "temperature와 tint는 피사체와 배경에 동일한 channel gain을 적용한다."
  offline_review:
    schedule: "0 12 * * * UTC (21:00 Asia/Seoul)"
    runtime_before_after_quality_gate: false
    production_auto_update: false
  lut_parameter_selection:
    decision_owner: "Hermes LLM이 이미지·요청·active technical library 전문의 전체 문맥으로 선택한다. 이 정책은 키워드·점수·alias 기반 routing을 하지 않는다."
    base_correction_before_creative_grade:
      required_technical_id: "base-correction-before-creative-grade"
      procedure: "노출·화이트밸런스·색중립과 피사체 가독성을 먼저 판단한 뒤 creative LUT를 선택한다. 전역 LUT로 국소 문제를 해결하려 하지 않는다."
    conservative_start:
      lut_intensity: [0.45, 0.70]
      grain_amount: [0.0, 0.10]
      halation: [0.0, 0.10]
    atmospheric_effects:
      required_technical_id: "restrained-atmospheric-softness"
      max_grain_amount: 0.10
      max_halation: 0.10
      procedure: "grain 또는 halation은 실제 대기감·필름 질감이 목표에 필요한 경우만 선택한다. 둘 다 기본값은 0이며, haze·회색 막·피사체 가독성 저하 징후가 있으면 적용하지 않는다."
    tonal_separation:
      required_technical_id: "diagnostic-tonal-shaping-and-endpoints"
      procedure: "하이라이트를 낮추고 그림자를 올리는 누적 조합이 검정점·중간톤 분리를 평평하게 만들지 검토한다. 전역 LUT가 부족하거나 국소 조정이 필요하면 capability warning 또는 Generate AI를 선택한다."
    promotion_requirements:
      - "offline report에서 독립된 반복 사례와 사용자 피드백을 비식별로 확인한다."
      - "고정된 권리 확보 TC에서 기존 registry와 candidate registry를 직접 시각 비교한다."
      - "benchmark 무회귀와 active evidence version 일치를 확인한 별도 개발 검증만 calibration_version을 올릴 수 있다."
      - "production runtime은 registry, LUT cube 또는 manifest를 자동으로 수정하지 않는다."
