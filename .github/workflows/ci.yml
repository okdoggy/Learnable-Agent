name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run python scripts/validate_utf8.py
      - run: bash -n scripts/register-hermes-cron.sh
      - run: uv run pytest
      - run: uv run python scripts/export_schemas.py
      - run: git diff --exit-code -- schemas/
